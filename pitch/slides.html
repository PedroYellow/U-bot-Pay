<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1920px;height:1080px;overflow:hidden;font-family:Poppins,sans-serif;color:#fff;background:radial-gradient(1400px 900px at 50% 45%,#2C2C9B 0%,#1A1A5E 40%,#0B0D2A 100%)}
.s{width:1920px;height:1080px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px}
.brand{position:absolute;top:56px;left:72px;display:flex;align-items:center;gap:14px;font-weight:600;font-size:40px}
.brand svg{width:50px;height:50px}
.orb{width:380px;height:380px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#BFE0FF 0%,#6FAEFF 28%,#4C7DF0 55%,#6C5CE7 85%,#3C2FA8 100%);box-shadow:0 0 160px rgba(92,140,255,.6),0 0 300px rgba(108,92,231,.4),inset 0 0 70px rgba(255,255,255,.18);display:grid;place-items:center}
.orb.sm{width:220px;height:220px}
.bars{display:flex;gap:14px;align-items:center}.bars i{width:14px;border-radius:8px;background:#fff;display:block}
.orb.sm .bars{gap:9px}.orb.sm .bars i{width:9px}
h1{font-size:112px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
h2{font-size:84px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
p{font-size:44px;color:rgba(255,255,255,.75);margin-top:28px;max-width:1400px;line-height:1.35}
.big{font-size:64px;color:#fff;font-weight:500}
.chips{display:flex;gap:18px;margin-top:48px;flex-wrap:wrap;justify-content:center}
.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:18px 34px;font-size:36px;font-weight:500}
.cards{display:flex;gap:28px;margin-top:56px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:44px 48px;width:520px;text-align:left}
.card .ic{font-size:60px;margin-bottom:18px}.card h3{font-size:40px;font-weight:600;margin-bottom:10px}.card p{font-size:30px;margin:0;color:rgba(255,255,255,.7)}
.flow{display:flex;align-items:center;gap:36px;margin-top:60px}
.node{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:40px 56px;text-align:center}
.node small{display:block;font-size:26px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}.node b{font-size:52px;font-weight:600}
.arrow{font-size:64px;color:rgba(255,255,255,.4)}
.code{font-family:ui-monospace,Menlo,monospace;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:40px 56px;font-size:38px;text-align:left;margin-top:52px;line-height:1.5;color:#D9DCF5}
.code .y{color:#FFB020}.code .g{color:#19D27C}.code .b{color:#5BC8FF}
.foot{position:absolute;bottom:56px;left:0;right:0;text-align:center;font-size:30px;color:rgba(255,255,255,.5)}
.lang{display:flex;gap:40px;margin-top:60px;flex-wrap:wrap;justify-content:center;max-width:1600px}
.lang span{font-size:52px;font-weight:500}
.url{font-size:72px;font-weight:600;margin-top:40px;color:#9DC4FF}
</style></head><body>
<div class="s" id="slide"></div>
<script>
const brand='<div class="brand"><svg viewBox="0 0 64 64"><defs><radialGradient id="g" cx="35%" cy="30%"><stop offset="0" stop-color="#BFE0FF"/><stop offset=".55" stop-color="#4C7DF0"/><stop offset="1" stop-color="#6C5CE7"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="url(#g)"/><g fill="#fff"><rect x="18" y="27" width="4" height="10" rx="2"/><rect x="25" y="22" width="4" height="20" rx="2"/><rect x="32" y="17" width="4" height="30" rx="2"/><rect x="39" y="22" width="4" height="20" rx="2"/><rect x="46" y="27" width="4" height="10" rx="2"/></g></svg>ubotpay</div>';
const orb=(sm,h)=>`<div class="orb ${sm?'sm':''}"><div class="bars">${(h||[36,64,96,64,36]).map(x=>`<i style="height:${sm?x*0.6:x}px"></i>`).join('')}</div></div>`;
const S={

 d1: brand+orb(false)+`<h1 style="margin-top:56px">Say it. Confirm it. Settled.</h1><p>Voice-first payments agent on Avalanche · USDC settled in under 2 seconds</p><div class="chips"><span class="chip">Live on mainnet</span><span class="chip">90+ languages</span><span class="chip">x402 agent payments</span></div><div class="foot">Avalanche Mini Grant application · October 2026 · ubotpay.com</div>`,
 d3: brand+`<h2>How it works</h2><div class="cards"><div class="card"><div class="ic">🎙</div><h3>1 · Say it</h3><p>"Send 2,000 baht to mom." Any language. Telegram voice note, phone call or web.</p></div><div class="card"><div class="ic">💱</div><h3>2 · Confirm it</h3><p>Local-currency quote, FX and fee read out loud. Nothing moves without a spoken yes.</p></div><div class="card"><div class="ic">⚡</div><h3>3 · Settled</h3><p>USDC on Avalanche C-Chain. Sub-second finality, tx link on every payment.</p></div></div>`,
 d4: brand+`<h2>Live on Avalanche mainnet</h2><p style="margin-top:16px">Two real transactions from the demo treasury</p><div class="cards" style="margin-top:44px"><div class="card" style="width:760px"><div class="ic">💬</div><h3>"Send 100 baht to mom"</h3><p>2.91 USDC settled in <b style="color:#fff">1.78 s</b><br><span style="font-size:24px;color:#9DC4FF">snowtrace.io/tx/0xc0f1…8623d</span></p></div><div class="card" style="width:760px"><div class="ic">🤖</div><h3>"Ask DataAgent about Sequoia"</h3><p>Paid another agent 0.50 USDC via x402 in <b style="color:#fff">2.23 s</b><br><span style="font-size:24px;color:#9DC4FF">snowtrace.io/tx/0x3d21…067fe</span></p></div></div><div class="foot">Open source · github.com/PedroYellow/U-bot-Pay · Built in 48 h at U-Hackathon 2026, Bangkok</div>`,
 d10: brand+`<h2>What the grant delivers</h2><p style="margin-top:12px">12 weeks · three milestones · all on Avalanche</p><div class="cards" style="margin-top:40px"><div class="card"><div class="ic">🔐</div><h3>M1 · Public beta</h3><p>Non-custodial passkey wallets, no seed phrases. Telegram + web.<br><b style="color:#fff">100 users · 500 payments</b></p></div><div class="card"><div class="ic">🏪</div><h3>M2 · Merchant pilot</h3><p>Bangkok & Chiang Mai, THB→USDC by voice. x402 rail opened to 3 third-party agents.<br><b style="color:#fff">10 merchants · $10k volume</b></p></div><div class="card"><div class="ic">📈</div><h3>M3 · Ecosystem</h3><p>2 AMAs, 1 conference, 3 SEA KOLs, public on-chain metrics dashboard.<br><b style="color:#fff">1,000 users · 5,000 tx</b></p></div></div>`,
 d11: brand+`<h2>Team</h2><div class="cards" style="margin-top:48px"><div class="card" style="width:900px"><div class="ic">👤</div><h3>Pedro Miranda · Founder</h3><p>Head of Strategic Relations at Yellow Capital (market making across 100+ exchanges). Superteam member, Solana Spain. Based between Andorra and Bangkok. Shipped ubotpay end-to-end in 48 h: voice, brain, chain, x402.</p></div><div class="card" style="width:620px"><div class="ic">🤝</div><h3>Partners</h3><p>ElevenLabs — voice<br>Ubot (U-topia) — brain<br>Avalanche — rail<br>Circle USDC — settlement</p></div></div>`,
 d12: brand+`<h2>The ask: $10,000 mini grant</h2><div class="cards" style="margin-top:48px"><div class="card"><div class="ic">🛠</div><h3>$4,000 · Product</h3><p>Passkey wallets, merchant invoices, x402 SDK for third-party agents.</p></div><div class="card"><div class="ic">🏪</div><h3>$2,500 · Pilot</h3><p>Merchant onboarding in Thailand, settlement float, support in Thai.</p></div><div class="card"><div class="ic">📣</div><h3>$3,500 · Growth</h3><p>2 AMAs, 1 conference, 3 SEA KOLs, metrics dashboard.</p></div></div><p style="margin-top:52px;color:#9DC4FF;font-weight:500">Every dollar lands as users and transactions on Avalanche.</p>`,
 s1: brand+orb(false)+`<h1 style="margin-top:56px">Hi. I'm ubotpay.</h1><p>Built in two days. Here's what I do.</p>`,
 s2: brand+`<h2>Banks have rails.<br>Apps have buttons.</h2><p class="big" style="margin-top:48px">Nobody has a conversation.</p><p style="margin-top:40px;color:#9DC4FF;font-weight:500">So I listen.</p>`,
 s4: brand+orb(true)+`<h2 style="margin-top:48px">Any language.<br>Same brain.</h2><div class="lang"><span>🇹🇭 ส่งเงินให้แม่</span><span>🇻🇳 Gửi tiền cho mẹ</span><span>🇪🇸 Mándale a mamá</span><span>🇬🇧 Send money to mom</span></div>`,
 s5: brand+`<h2>Safe by design.</h2><div class="cards"><div class="card"><div class="ic">🗣</div><h3>Spoken yes</h3><p>Nothing moves without it.</p></div><div class="card"><div class="ic">👥</div><h3>Dual control</h3><p>Big payments need a second person.</p></div><div class="card"><div class="ic">📊</div><h3>Daily limits</h3><p>Built in. Per user.</p></div></div>`,
 s6: brand+`<h2>I pay other agents too.</h2><div class="code"><span class="b">GET</span> agent.ubotpay.com/report?company=Sequoia<br>→ <span class="y">402 Payment Required</span> · 0.50 USDC<br><span class="b">GET</span> … <span class="g">X-PAYMENT:</span> &lt;signed USDC authorization&gt;<br>→ <span class="g">200 OK</span> · report + tx on Avalanche</div><p style="margin-top:44px">No API key. No card. <b style="color:#fff">Money as an HTTP header.</b></p>`,
 s6b: brand+`<h2>How I make money</h2><div class="cards"><div class="card"><div class="ic">💸</div><h3>0.5% per transfer</h3><p>Banks charge 5–7%.</p></div><div class="card"><div class="ic">💱</div><h3>0.3% FX spread</h3><p>Like Wise. Invisible, every trade.</p></div><div class="card"><div class="ic">🤖</div><h3>1% agent rail</h3><p>Every AI-to-AI payment.</p></div></div><p style="margin-top:48px">Shown on every quote. <b style="color:#fff">Transparent by design.</b></p>`,
 s7: brand+`<h2>Under the hood</h2><div class="flow"><div class="node"><small>Voice</small><b>ElevenLabs</b></div><div class="arrow">→</div><div class="node"><small>Brain</small><b>Ubot</b></div><div class="arrow">→</div><div class="node"><small>Rail</small><b>Avalanche</b></div></div><p style="margin-top:56px">Live on mainnet · Real USDC · Under two seconds</p>`,
 s8: brand+orb(false)+`<h1 style="margin-top:36px">Say it. Confirm it. Settled.</h1><div class="url" style="margin-top:24px">ubotpay.com</div> <div class="chips" style="margin-top:28px"><span class="chip"><svg viewBox="0 0 24 24" style="width:40px;height:40px;vertical-align:-8px;margin-right:10px"><path fill="#fff" d="M18.9 2H22l-7.3 8.3L23.2 22h-6.7l-5.2-6.8L5.3 22H2.2l7.8-8.9L1.5 2h6.9l4.7 6.2L18.9 2zm-1.2 18h1.8L7 3.9H5.1L17.7 20z"/></svg>@Ubotpay</span><span class="chip"><svg viewBox="0 0 24 24" style="width:42px;height:42px;vertical-align:-9px;margin-right:10px"><path fill="#fff" d="M9.6 15.5l-.4 5.3c.6 0 .8-.2 1.1-.5l2.6-2.5 5.4 4c1 .5 1.7.3 2-.9L23.9 3.6c.3-1.4-.5-2-1.5-1.6L1.7 10c-1.4.5-1.4 1.3-.2 1.7l5.3 1.6L19 5.6c.6-.4 1.1-.2.7.2L9.6 15.5z"/></svg>@Ubotpaybot</span><span class="chip">✉ hello@ubotpay.com</span></div><div class="foot" style="bottom:104px">github.com/PedroYellow/U-bot-Pay · U-Hackathon 2026 · ElevenLabs × Ubot × Avalanche × U-topia</div>`,
};
const k=new URLSearchParams(location.search).get("s")||"s1"; document.getElementById("slide").innerHTML=S[k];
</script></body></html>
