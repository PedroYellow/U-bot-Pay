<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:800px;height:800px;background:radial-gradient(500px 500px at 50% 45%,#2C2C9B 0%,#1A1A5E 45%,#0B0D2A 100%);display:grid;place-items:center}
.orb{width:520px;height:520px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#BFE0FF 0%,#6FAEFF 28%,#4C7DF0 55%,#6C5CE7 85%,#3C2FA8 100%);box-shadow:0 0 120px rgba(92,140,255,.6),0 0 220px rgba(108,92,231,.4),inset 0 0 70px rgba(255,255,255,.18);display:grid;place-items:center}

</style></head><body><div class="orb"><div class="bars"><i style="height:70px"></i><i style="height:130px"></i><i style="height:200px"></i><i style="height:130px"></i><i style="height:70px"></i></div></div></body></html>
