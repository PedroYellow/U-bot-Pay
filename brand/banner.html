<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1500px;height:500px;font-family:Poppins,sans-serif;color:#fff;background:radial-gradient(900px 600px at 25% 50%,#2C2C9B 0%,#1A1A5E 40%,#0B0D2A 100%);display:flex;align-items:center;padding:0 90px;box-sizing:border-box;gap:70px;overflow:hidden}
.orb{flex:none;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#BFE0FF 0%,#6FAEFF 28%,#4C7DF0 55%,#6C5CE7 85%,#3C2FA8 100%);box-shadow:0 0 110px rgba(92,140,255,.6),inset 0 0 50px rgba(255,255,255,.18);display:grid;place-items:center}
.bars{display:flex;gap:12px;align-items:center}.bars i{width:12px;border-radius:8px;background:#fff;display:block}
h1{font-size:84px;font-weight:600;letter-spacing:-.03em;margin:0;line-height:1.05}
p{font-size:32px;color:rgba(255,255,255,.72);margin:18px 0 0}
.chips{display:flex;gap:14px;margin-top:30px}.chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 22px;font-size:24px;font-weight:500}
</style></head><body>
<div class="orb"><div class="bars"><i style="height:40px"></i><i style="height:75px"></i><i style="height:115px"></i><i style="height:75px"></i><i style="height:40px"></i></div></div>
<div><h1>Say it. Confirm it. Settled.</h1><p>Voice-first USDC payments on Avalanche. Any language. Under two seconds.</p>
<div class="chips"><span class="chip">🎙 ElevenLabs</span><span class="chip">⛓ Avalanche</span><span class="chip">🤖 x402</span><span class="chip">ubotpay.com</span></div></div>
</body></html>
