limit_req_zone $binary_remote_addr zone=ubotapi:10m rate=30r/m;
server {
    server_name ubotpay.com www.ubotpay.com api.ubotpay.com;
    root /var/www/ubotpay;
    index index.html;
    location /turn { limit_req zone=ubotapi burst=10 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:8090/turn; proxy_set_header Host $host; proxy_read_timeout 120; }
    location /approve { proxy_pass http://127.0.0.1:8090/approve; proxy_set_header Host $host; }
    location /balance/ { proxy_pass http://127.0.0.1:8090/balance/; }
    location /history/ { proxy_pass http://127.0.0.1:8090/history/; }
    location /invoices/ { proxy_pass http://127.0.0.1:8090/invoices/; }
    location /x402/ { proxy_pass http://127.0.0.1:8090/x402/; }
    location /agent/ { limit_req zone=ubotapi burst=5 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:8090/agent/; proxy_set_header Host $host; proxy_read_timeout 120; }
    location /demo/ { proxy_pass http://127.0.0.1:8090/demo/; }
    location /health { proxy_pass http://127.0.0.1:8090/health; }
    location /docs { proxy_pass http://127.0.0.1:8090/docs; }
    location /openapi.json { proxy_pass http://127.0.0.1:8090/openapi.json; }
    location = /ubot.css { add_header Access-Control-Allow-Origin *; add_header Cache-Control "no-cache"; }
    location /pitch { alias /var/www/ubotpay/pitch; index index.html; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache, must-revalidate"; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.ubotpay.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.ubotpay.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot








}
server {
    if ($host = ubotpay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = api.ubotpay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.ubotpay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name ubotpay.com www.ubotpay.com api.ubotpay.com;
    return 404; # managed by Certbot






}
server {
    server_name agent.ubotpay.com;
    location / { proxy_pass http://127.0.0.1:8091; proxy_set_header Host $host; proxy_read_timeout 120; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.ubotpay.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.ubotpay.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = agent.ubotpay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name agent.ubotpay.com;
    return 404; # managed by Certbot


}