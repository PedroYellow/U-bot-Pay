# U-bot Pay — nginx config (security-hardened)
# Apply with: sudo cp deploy/nginx.conf /etc/nginx/sites-enabled/ubotpay && sudo nginx -t && sudo systemctl reload nginx

# Rate limit zone for public endpoints (/turn). API endpoints rely on application-level auth.
limit_req_zone $binary_remote_addr zone=ubotturn:10m rate=20r/m;

# Trust the local origin so CORS preflights behave correctly.
map $http_origin $cors_origin {
    default "";
    ~^https://(ubotpay|agent\.ubotpay)\.com$ $http_origin;
}

server {
    server_name ubotpay.com www.ubotpay.com api.ubotpay.com;
    root /var/www/ubotpay;
    types {
        # MIME types scoped to this server. Resets the global mime.types
        # for this server, so every file we serve has to be listed here.
        text/html                 html htm shtml;
        text/css                  css;
        text/xml                  xml;
        text/javascript           js;
        text/plain                txt;
        application/javascript    js;
        application/json          json;
        application/xml           xml;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/gif                 gif;
        image/svg+xml             svg svgz;
        image/webp                webp;
        image/x-icon              ico;
        application/manifest+json webmanifest;
        application/wasm          wasm;
        font/woff                 woff;
        font/woff2                woff2;
        font/ttf                  ttf;
        font/otf                  otf;
    }
    index index.html;

    # Hide server version.
    server_tokens off;

    # Security headers (audit #6).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.ubotpay.com https://agent.ubotpay.com; frame-ancestors 'none'; base-uri 'self'" always;

    # ── CORS: only allow the production origins (no wildcard for any authenticated route) ──
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Max-Age 86400 always;
    if ($request_method = OPTIONS) { return 204; }

    # ── Public chat (quotes only, no signing) — rate-limited per IP. ──
    location = /turn {
        limit_req zone=ubotturn burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090/turn;
        proxy_set_header Host $host;
        proxy_read_timeout 120;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    # ── Admin/server-to-server endpoints. Nginx adds a fixed x-internal-key
    # header; the app checks both the client-sent key AND this internal key, so
    # browsers (which cannot set custom headers without CORS preflight tricks)
    # cannot reach these. ──
    location = /health { proxy_pass http://127.0.0.1:8090/health; }
    location = /health/full { proxy_pass http://127.0.0.1:8090/health/full; }
    location = /approve { proxy_pass http://127.0.0.1:8090/approve; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location = /balance { proxy_pass http://127.0.0.1:8090/balance; proxy_hide_header Access-Control-Allow-Origin; }
    location /balance/ { proxy_pass http://127.0.0.1:8090/balance/; proxy_hide_header Access-Control-Allow-Origin; }
    location = /history { proxy_pass http://127.0.0.1:8090/history; proxy_hide_header Access-Control-Allow-Origin; }
    location = /invoices { proxy_pass http://127.0.0.1:8090/invoices; proxy_hide_header Access-Control-Allow-Origin; }
    location /x402/ { proxy_pass http://127.0.0.1:8090/x402/; proxy_hide_header Access-Control-Allow-Origin; }
    location = /agent/query { proxy_pass http://127.0.0.1:8090/agent/query; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location /auth/ { proxy_pass http://127.0.0.1:8090/auth/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location /bridge/ { proxy_pass http://127.0.0.1:8090/bridge/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location /push/ { proxy_pass http://127.0.0.1:8090/push/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location = /demo/seed { proxy_pass http://127.0.0.1:8090/demo/seed; proxy_hide_header Access-Control-Allow-Origin; }
    location = /pricing { proxy_pass http://127.0.0.1:8090/pricing; proxy_hide_header Access-Control-Allow-Origin; }
    location = /docs { proxy_pass http://127.0.0.1:8090/docs; proxy_hide_header Access-Control-Allow-Origin; }
    location = /dashboard { proxy_pass http://127.0.0.1:8090/dashboard; proxy_hide_header Access-Control-Allow-Origin; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8090/openapi.json; proxy_hide_header Access-Control-Allow-Origin; }

    # ── Static assets ──
    location = /ubot.css { add_header Cache-Control "no-cache"; }
    location = /i18n.js { add_header Cache-Control "no-cache"; }
    location = /manifest.json { add_header Cache-Control "no-cache"; default_type application/manifest+json; }
    location = /sw.js { add_header Cache-Control "no-store, must-revalidate"; default_type application/javascript; }
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ { default_type image/png; add_header Cache-Control "public, max-age=86400"; }
    location /pitch { alias /var/www/ubotpay/pitch; index index.html; add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri.html $uri/ /index.html; add_header Cache-Control "no-cache, must-revalidate"; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.ubotpay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ubotpay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name agent.ubotpay.com;
    server_tokens off;
    root /var/www/ubotpay/agent;
    types {
        text/html                 html htm shtml;
        text/css                  css;
        application/javascript    js;
        application/json          json;
        image/png                 png;
        image/svg+xml             svg svgz;
        application/manifest+json webmanifest;
    }
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: connect-src must include ubotpay.com + api.ubotpay.com for wallet-connect
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://ubotpay.com https://api.ubotpay.com; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # ── DataAgent backend (x402) ──
    location = /report  { proxy_pass http://127.0.0.1:8091/report; proxy_set_header Host $host; proxy_read_timeout 120; }
    location = /health  { proxy_pass http://127.0.0.1:8091/health; proxy_set_header Host $host; }

    # ── wallet-connect from main ubotpay backend ──
    location /auth/   { proxy_pass http://127.0.0.1:8090/auth/; proxy_set_header Host $host; }

    # ── Static web ──
    location = / { try_files /index.html /index.html; add_header Cache-Control "no-cache, must-revalidate"; }
    location / { try_files $uri $uri.html $uri/ /index.html; add_header Cache-Control "no-cache, must-revalidate"; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.ubotpay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ubotpay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
