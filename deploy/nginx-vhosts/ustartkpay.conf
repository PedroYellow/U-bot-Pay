# U-bot Pay — ustartkpay.com whitelabel
# Its OWN backend: the native Starknet service on 127.0.0.1:8095.
# NOT the Avalanche one on 8090 - Starknet is not EVM, it needs the
# starknet engine. Separate hostname, separate rate-limit buckets and
# its own CORS origin. Rate-limit zone names are global in nginx, so
# they must differ from the ubotpay ones.

limit_req_zone $binary_remote_addr zone=ustartkturn:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ustartkquote:10m rate=20r/m;

map $http_origin $ustartkpay_cors_origin {
    default "";
    ~^https://(ustartkpay|www\.ustartkpay|agent\.ustartkpay)\.com$ $http_origin;
}

server {
    server_name ustartkpay.com www.ustartkpay.com api.ustartkpay.com;
    root /var/www/ustartkpay;

    # Audit 20 Oct: the static site had no security headers at all — no CSP, no
    # HSTS, no nosniff, no frame-ancestors — while the API had all of them. That
    # is the surface that runs the wallet-connect code, so it is the one that
    # matters most.
    #
    # 'unsafe-inline' is required for script-src: index.html opens with an inline
    # <script> that reads localStorage and sets data-theme before first paint, to
    # avoid a flash of the wrong theme. style-src also needs it for the inline
    # <style> block. Everything else is locked to the origins the page actually
    # loads from, verified against the live site.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.ustartkpay.com https://agent.ustartkpay.com https://api.elevenlabs.io https://api.us.elevenlabs.io https://api.eu.residency.elevenlabs.io https://api.in.residency.elevenlabs.io https://elevenlabs.io https://cdn.jsdelivr.net https://storage.googleapis.com wss://livekit.rtc.elevenlabs.io wss://api.us.elevenlabs.io wss://api.eu.residency.elevenlabs.io wss://api.in.residency.elevenlabs.io; frame-src https://agent.ustartkpay.com https://app.elevenlabs.io https://elevenlabs.io; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; worker-src 'self' blob:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), payment=(self)" always;
    types {
        # MIME types scoped to this server. Resets the global mime.types
        # for this server, so every file we serve has to be listed here.
        text/html                 html htm shtml;
        text/css                  css;
        text/xml                  xml;
        text/javascript           js;
        text/plain                txt;
        application/javascript    js;
        application/json          json;
        application/xml           xml;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/gif                 gif;
        image/svg+xml             svg svgz;
        image/webp                webp;
        image/x-icon              ico;
        application/manifest+json webmanifest;
        application/wasm          wasm;
        font/woff                 woff;
        font/woff2                woff2;
        font/ttf                  ttf;
        font/otf                  otf;
    }
    index index.html;

    # Hide server version.
    server_tokens off;

    # (audit #6 duplicate server-level security set removed 27 Oct 2026 —
    #  the richer set above is now the single canonical one. Duplicated
    #  add_header sets meant browsers enforced only the first policy.)

    # ── CORS: only allow the production origins (no wildcard for any authenticated route) ──
    add_header Access-Control-Allow-Origin $ustartkpay_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Max-Age 86400 always;
    if ($request_method = OPTIONS) { return 204; }

    # ── Public chat (quotes only, no signing) — rate-limited per IP. ──
    location = /turn {
        limit_req zone=ustartkturn burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8095/turn; proxy_set_header Host $host;

        proxy_read_timeout 120;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    # ── Admin/server-to-server endpoints. Nginx adds a fixed x-internal-key
    # header; the app checks both the client-sent key AND this internal key, so
    # browsers (which cannot set custom headers without CORS preflight tricks)
    # cannot reach these. ──
    location = /health { proxy_pass http://127.0.0.1:8095/health; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /health/full { proxy_pass http://127.0.0.1:8095/health/full; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /approve { proxy_pass http://127.0.0.1:8095/approve; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /balance { proxy_pass http://127.0.0.1:8095/balance; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location /balance/ { proxy_pass http://127.0.0.1:8095/balance/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /history { proxy_pass http://127.0.0.1:8095/history; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location /history/ { proxy_pass http://127.0.0.1:8095/history/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /invoices { proxy_pass http://127.0.0.1:8095/invoices; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location /invoices/ { proxy_pass http://127.0.0.1:8095/invoices/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location /x402/ { proxy_pass http://127.0.0.1:8095/x402/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /agent/query { proxy_pass http://127.0.0.1:8095/agent/query; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location /auth/ { proxy_pass http://127.0.0.1:8095/auth/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    # Audit 20 Oct round 4: quote only. The rest of /bridge/ is authenticated
    # per user (history, analytics, start, confirm), so it must not share this
    # per-IP budget. An exact-match location wins over the prefix below.
    location = /bridge/quote {
        limit_req zone=ustartkquote burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8095/bridge/quote; proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_hide_header Access-Control-Allow-Origin;
    }
    location /bridge/ { proxy_pass http://127.0.0.1:8095/bridge/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location /push/ { proxy_pass http://127.0.0.1:8095/push/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    # TronRental energy (integration 21 Oct 2026). Without this the SPA
    # fallback answers with index.html before the request reaches the API.
    location /energy/ { proxy_pass http://127.0.0.1:8095/energy/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /demo/seed { proxy_pass http://127.0.0.1:8095/demo/seed; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /pricing { proxy_pass http://127.0.0.1:8095/pricing; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /docs { proxy_pass http://127.0.0.1:8095/docs; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    # Public treasury endpoint (audit round 3, S-3). Needed by the homepage
    # footer so the treasury address is not hardcoded in the static HTML.
    location = /treasury { proxy_pass http://127.0.0.1:8095/treasury; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /dashboard { proxy_pass http://127.0.0.1:8095/dashboard; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8095/openapi.json; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }

    # ── Static assets ──
    location = /ubot.css {
        expires -1;
    }
    location = /i18n.js {
        expires -1;
    }
    location = /manifest.json {
        default_type application/manifest+json;
        expires -1;
    }
    # Audit 20 Oct round 5: without this, /.well-known/security.txt falls through
    # to the SPA catch-all and returns index.html with a 200 — which reads as
    # "we have a security.txt" to anyone who checks. Serve the real file.
    # Certbot webroot renewal: the ACME challenge must be fetchable over
    # http on the bare domain. Without this, renewal fails silently ~60
    # days after issue and the site ends up serving an expired cert.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ustartkpay;
        default_type text/plain;
        try_files $uri =404;
    }
    location ^~ /.well-known/ {
        root /var/www/ustartkpay;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /sw.js {
        default_type application/javascript;
        expires -1;
    }
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ { default_type image/png; expires 1d; }
    location /pitch { alias /var/www/ustartkpay/pitch; index index.html; expires -1; }
    # ── Audit 2026-10-27: never serve backup / old-copy files (L-3-static) ──
    # The SPA catch-all below rewrites any unmatched path to /index.html, so a
    # stray .bak-* file in the webroot used to be served verbatim as
    # application/octet-stream (and index.html.bak-* carried a second-order
    # XSS). Files are removed from the webroot AND denied here so a future
    # deploy cannot re-expose them. Regex locations are evaluated after the
    # longest prefix match but before the `location /` fallback, so these win
    # over the SPA rewrite.
    location ~* \.(bak|before|after|pre|post|orig|tmp|swp|save|old|backup)(\.|[-_]|$) {
        return 404;
    }
    location ~* (before-fix|pre-fix|post-fix|fix)[-_a-z0-9]*\.(html|js|css|json|txt)$ {
        return 404;
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
        expires -1;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.ustartkpay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ustartkpay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    # Port 80: serve the ACME challenge for certbot's webroot renewer and
    # redirect everything else to https. Without this the renewer cannot
    # complete a challenge and the certificate silently expires ~60 days
    # after issue.
    listen 80;
    server_name ustartkpay.com www.ustartkpay.com api.ustartkpay.com agent.ustartkpay.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ustartkpay;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    server_name agent.ustartkpay.com;
    server_tokens off;
    root /var/www/ustartkpay/agent;
    types {
        text/html                 html htm shtml;
        text/css                 css;
        application/javascript    js;
        application/json          json;
        image/png                 png;
        image/svg+xml             svg svgz;
        application/manifest+json webmanifest;
    }
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://ustartkpay.com https://api.ustartkpay.com; frame-ancestors 'none'; base-uri 'self'; worker-src 'self' blob:;" always;
    add_header Access-Control-Allow-Origin $ustartkpay_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/agent.ustartkpay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.ustartkpay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── DataAgent backend (x402) ──
    location = /report { proxy_pass http://127.0.0.1:8091/report; proxy_set_header Host $host; proxy_read_timeout 120; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /health  { proxy_pass http://127.0.0.1:8091/health; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }

    # ── wallet-connect from the main backend ──
    location /auth/   { proxy_pass http://127.0.0.1:8095/auth/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }

    # ── Static web ──
    location = / { try_files /index.html /index.html; add_header Cache-Control "no-cache, must-revalidate"; }
    location / { try_files $uri $uri.html $uri/ /index.html; add_header Cache-Control "no-cache, must-revalidate"; }
}
