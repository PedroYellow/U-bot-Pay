# USolPay — nginx config (pre-cert).
#
# Same shape as the Utron Pay vhost: static frontend from /var/www/usolpay,
# API proxied to 127.0.0.1:8093. The two brands do not share a server block
# and do not share a port.

limit_req_zone $binary_remote_addr zone=usolapi:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=usolvoice:10m rate=6r/m;

server {
    server_name usolpay.com www.usolpay.com api.usolpay.com agent.usolpay.com;
    root /var/www/usolpay;
    index index.html;
    server_tokens off;

    # ── security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ── API ──────────────────────────────────────────────────────
    # The LLM endpoint is the expensive one and the one that spends
    # money through the agent, so it gets its own tighter bucket.
    location = /voice/session { limit_req zone=usolvoice burst=4 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:8093/voice/session; proxy_set_header Host $host; }
    # The web payment flow: the backend builds the transaction, the
    # user's wallet signs it.
    # The list of what this deployment settles in. The frontend
    # reads it to fill the token selector.
    location = /chains { proxy_pass http://127.0.0.1:8093/chains; proxy_set_header Host $host; }
    location = /pay/build { proxy_pass http://127.0.0.1:8093/pay/build; proxy_set_header Host $host; proxy_read_timeout 30; }
    location = /pay/submit { proxy_pass http://127.0.0.1:8093/pay/submit; proxy_set_header Host $host; proxy_read_timeout 30; }
    location = /pay/status { proxy_pass http://127.0.0.1:8093/pay/status; proxy_set_header Host $host; proxy_read_timeout 30; }
    location = /turn { limit_req zone=usolapi burst=8 nodelay; limit_req_status 429; proxy_pass http://127.0.0.1:8093/turn; proxy_set_header Host $host; proxy_read_timeout 120; }
    location = /approve { proxy_pass http://127.0.0.1:8093/approve; proxy_set_header Host $host; }

    location /balance/ { proxy_pass http://127.0.0.1:8093/balance/; }
    location /history/ { proxy_pass http://127.0.0.1:8093/history/; }
    location /invoices/ { proxy_pass http://127.0.0.1:8093/invoices/; }
    location /x402/ { proxy_pass http://127.0.0.1:8093/x402/; }
    location /auth/ { proxy_pass http://127.0.0.1:8093/auth/; }
    location /bridge/ { proxy_pass http://127.0.0.1:8093/bridge/; }
    location /push/ { proxy_pass http://127.0.0.1:8093/push/; }
    location /energy/ { proxy_pass http://127.0.0.1:8093/energy/; }
    location = /demo/seed { proxy_pass http://127.0.0.1:8093/demo/seed; }
    location = /pricing { proxy_pass http://127.0.0.1:8093/pricing; }
    location = /docs { proxy_pass http://127.0.0.1:8093/docs; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8093/openapi.json; }
    # Public treasury endpoint (audit round 3, S-3). Needed by the homepage
    # footer so the treasury address is not hardcoded in the static HTML.
    # It was missing here, so the request fell through to the SPA fallback
    # and this host answered 200 with the site HTML.
    location = /treasury { proxy_pass http://127.0.0.1:8093/treasury; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /dashboard { proxy_pass http://127.0.0.1:8093/dashboard; }
    location = /health { proxy_pass http://127.0.0.1:8093/health; }

    # ── static ───────────────────────────────────────────────────
    location = /ubot.css { add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/usolpay-security-headers.conf;
    }
    location = /i18n.js { add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/usolpay-security-headers.conf;
    }
    location = /manifest.json { add_header Cache-Control "no-cache"; default_type application/manifest+json;
        include /etc/nginx/snippets/usolpay-security-headers.conf;
    }
    location = /sw.js { add_header Cache-Control "no-store, must-revalidate"; default_type application/javascript;
        include /etc/nginx/snippets/usolpay-security-headers.conf;
    }
    location = /agent { rewrite ^/agent$ /agent/index.html break; }
    location /.well-known/ { default_type text/plain; try_files $uri =404; }
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ { default_type image/png; add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/usolpay-security-headers.conf;
    }
    location /pitch { alias /var/www/usolpay/pitch; index index.html; add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/usolpay-security-headers.conf;
    }
    location / { try_files $uri $uri.html $uri/ /index.html; add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/usolpay-security-headers.conf;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/usolpay.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/usolpay.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot




}


server {
    if ($host = agent.usolpay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = api.usolpay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.usolpay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = usolpay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name usolpay.com www.usolpay.com api.usolpay.com agent.usolpay.com;
    listen 80;
    return 404; # managed by Certbot








}