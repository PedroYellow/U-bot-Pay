# UtronPay — nginx config.
# Static frontend from /var/www/utronpay; API on 127.0.0.1:8092.
# This brand owns utronpay.com, www, api and agent. It must never inherit
# UbotPay's TLS vhost: that was the reason the UtronPay domain served
# the UbotPay homepage over HTTPS.

limit_req_zone $binary_remote_addr zone=utronapi:10m rate=20r/m;

map $http_origin $utron_cors_origin {
    default "";
    ~^https://(utronpay|agent\.utronpay)\.com$ $http_origin;
}

server {
    server_name utronpay.com www.utronpay.com api.utronpay.com;
    root /var/www/utronpay;
    index index.html;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), payment=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.utronpay.com https://agent.utronpay.com https://api.elevenlabs.io https://api.us.residency.elevenlabs.io https://api.eu.residency.elevenlabs.io https://api.in.residency.elevenlabs.io https://elevenlabs.io https://cdn.jsdelivr.net https://storage.googleapis.com wss://livekit.rtc.elevenlabs.io wss://api.us.residency.elevenlabs.io wss://api.eu.residency.elevenlabs.io wss://api.in.residency.elevenlabs.io; frame-src https://agent.utronpay.com https://app.elevenlabs.io https://elevenlabs.io; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; worker-src 'self' blob:" always;

    add_header Access-Control-Allow-Origin $utron_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Max-Age 86400 always;
    if ($request_method = OPTIONS) { return 204; }

    location = /turn {
        limit_req zone=utronapi burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8092/turn;
        proxy_set_header Host $host;
        proxy_read_timeout 120;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }
    location = /approve { proxy_pass http://127.0.0.1:8092/approve; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location = /balance { proxy_pass http://127.0.0.1:8092/balance; proxy_hide_header Access-Control-Allow-Origin; }
    location /balance/ { proxy_pass http://127.0.0.1:8092/balance/; proxy_hide_header Access-Control-Allow-Origin; }
    location = /history { proxy_pass http://127.0.0.1:8092/history; proxy_hide_header Access-Control-Allow-Origin; }
    location /history/ { proxy_pass http://127.0.0.1:8092/history/; proxy_hide_header Access-Control-Allow-Origin; }
    location = /invoices { proxy_pass http://127.0.0.1:8092/invoices; proxy_hide_header Access-Control-Allow-Origin; }
    location /invoices/ { proxy_pass http://127.0.0.1:8092/invoices/; proxy_hide_header Access-Control-Allow-Origin; }
    location /x402/ { proxy_pass http://127.0.0.1:8092/x402/; proxy_hide_header Access-Control-Allow-Origin; }
    location = /agent/query { proxy_pass http://127.0.0.1:8092/agent/query; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location /auth/ { proxy_pass http://127.0.0.1:8092/auth/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location /bridge/ { proxy_pass http://127.0.0.1:8092/bridge/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location /push/ { proxy_pass http://127.0.0.1:8092/push/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location /energy/ { proxy_pass http://127.0.0.1:8092/energy/; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; }
    location = /demo/seed { proxy_pass http://127.0.0.1:8092/demo/seed; proxy_hide_header Access-Control-Allow-Origin; }
    location = /pricing { proxy_pass http://127.0.0.1:8092/pricing; proxy_hide_header Access-Control-Allow-Origin; }
    location = /docs { proxy_pass http://127.0.0.1:8092/docs; proxy_hide_header Access-Control-Allow-Origin; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8092/openapi.json; proxy_hide_header Access-Control-Allow-Origin; }
    # Public treasury endpoint (audit round 3, S-3). Needed by the homepage
    # footer so the treasury address is not hardcoded in the static HTML.
    # It was missing here, so the request fell through to the SPA fallback
    # and this host answered 200 with the site HTML.
    location = /treasury { proxy_pass http://127.0.0.1:8092/treasury; proxy_set_header Host $host; proxy_hide_header Access-Control-Allow-Origin; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Real-IP $remote_addr; }
    location = /dashboard { proxy_pass http://127.0.0.1:8092/dashboard; proxy_hide_header Access-Control-Allow-Origin; }
    location = /health { proxy_pass http://127.0.0.1:8092/health; proxy_hide_header Access-Control-Allow-Origin; }

    location = /ubot.css {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Cache-Control "no-cache"; }
    location = /i18n.js {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Cache-Control "no-cache"; }
    location = /manifest.json {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Cache-Control "no-cache"; default_type application/manifest+json; }
    location = /sw.js {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 add_header Cache-Control "no-store, must-revalidate"; default_type application/javascript; }
    location ^~ /.well-known/ { default_type text/plain; try_files $uri =404; }
    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 default_type image/png; add_header Cache-Control "public, max-age=86400"; }
    location /pitch {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 alias /var/www/utronpay/pitch; index index.html; add_header Cache-Control "no-cache"; }
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
 try_files $uri $uri.html $uri/ /index.html; add_header Cache-Control "no-cache, must-revalidate"; }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/utronpay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utronpay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_crl /etc/ssl/utronpay.crl;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name agent.utronpay.com;
    root /var/www/utronpay/agent;
    index index.html;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://utronpay.com https://api.utronpay.com; frame-ancestors 'none'; base-uri 'self'; worker-src 'self' blob:" always;
    add_header Access-Control-Allow-Origin $utron_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    location = /report {
        proxy_pass http://127.0.0.1:8091/report; proxy_set_header Host $host; proxy_read_timeout 120;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8091/health; proxy_set_header Host $host;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:8092/auth/; proxy_set_header Host $host;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = / {
        try_files /index.html /index.html; add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    location / {
        try_files $uri $uri.html $uri/ /index.html; add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/utronpay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utronpay.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_crl /etc/ssl/utronpay.crl;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name utronpay.com www.utronpay.com api.utronpay.com agent.utronpay.com;
    listen 80;
    return 301 https://$host$request_uri;
}
